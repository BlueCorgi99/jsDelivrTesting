<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.5" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#06070c"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff454f"/>
      <stop offset="1" stop-color="#e50920"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151923"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff1f35" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff1f35" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="redGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <rect width="1440" height="1000" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="1100" cy="300" rx="400" ry="350" fill="url(#glow)"/>
  <ellipse cx="350" cy="700" rx="350" ry="250" fill="url(#glow)" opacity=".18"/>

